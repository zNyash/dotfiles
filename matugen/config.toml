# command = "awww img '{{ image }}' --transition-type grow --transition-duration 2 --transition-fps 60"

# Terminal
[templates.kitty]
input_path = '~/.config/matugen/templates/kitty/kitty.conf'
output_path = '~/.config/kitty/kitty.conf'

# Hyprland colors template
[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland/colors.lua'
output_path = '~/.config/hypr/nsh/matugen.lua'

# VS Code matugen extension
[templates.vscode-raw]
input_path = '~/.config/matugen/templates/vscode/vscode-colors'
output_path = '~/.cache/matugen/vscode-colors'

[templates.vscode-json]
input_path = '~/.config/matugen/templates/vscode/vscode-colors.json'
output_path = '~/.cache/matugen/vscode-colors.json'

